<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.12"/>
    </pattern>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4" rx="16"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#ff003c" stroke-width="1" opacity="0.3" rx="12"/>

  <!-- Corner Brackets -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00ff41" stroke-width="4"/>
  <path d="M 1170 70 L 1170 30 L 1130 30" fill="none" stroke="#00ff41" stroke-width="4"/>
  <path d="M 30 560 L 30 600 L 70 600" fill="none" stroke="#00ff41" stroke-width="4"/>
  <path d="M 1170 560 L 1170 600 L 1130 600" fill="none" stroke="#00ff41" stroke-width="4"/>

  <!-- Tag / Status -->
  <rect x="450" y="80" width="300" height="36" rx="18" fill="#111" stroke="#00ff41" stroke-width="1.5"/>
  <text x="600" y="104" font-family="'Courier New', monospace" font-size="14" fill="#00ff41" text-anchor="middle" letter-spacing="4">STATUS: PROTOCOLO ATIVADO</text>

  <!-- Title -->
  <text x="600" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#ff003c" text-anchor="middle" letter-spacing="6" filter="url(#neon-glow)">APOCALIPSE IA</text>
  <text x="604" y="244" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="6" opacity="0.6">APOCALIPSE IA</text>

  <!-- Slogan -->
  <text x="600" y="320" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Quando as IAs dominarem o mundo,
  </text>
  <text x="600" y="360" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#00ff41" text-anchor="middle">
    suas chances dependem das suas respostas.
  </text>

  <!-- Subtitle / CTA -->
  <rect x="420" y="420" width="360" height="60" rx="8" fill="#00ff41" filter="url(#neon-glow)"/>
  <text x="600" y="458" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">FAÇA SEU TESTE AGORA</text>

  <!-- Footer Info -->
  <text x="600" y="550" font-family="'Courier New', monospace" font-size="14" fill="#666666" text-anchor="middle">
    [ SISTEMA DE CLASSIFICAÇÃO DE SOBREVIVÊNCIA HUMANA ]
  </text>
</svg>
